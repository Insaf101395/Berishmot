# /etc/nginx/sites-available/berishmot  (затем symlink в sites-enabled)
# Отдаёт VK-фид (/vk_batch.xml) и фото (/img/...) с вашего домена.
server {
    listen 80;
    server_name img.berishmot.store;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# После этого выпустите HTTPS:  sudo certbot --nginx -d img.berishmot.store
